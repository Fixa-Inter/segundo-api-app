spring:
  application:
    name: fixa-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
    open-in-view: false

  cache:
    type: redis

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}


jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

firebase:
  project-id: ${FIREBASE_PROJECT_ID:fixa-fead2}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

app:
  jobs:
    os-atrasadas:
      cron: 0 0 9 * * *
      segundo-cron: 0 30 1 * * *

management:
  health:
      mail:
        enabled: false
      redis:
        enabled: false

  endpoints:
    web:
      exposure:
        include: health
