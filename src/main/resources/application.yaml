spring:
  application:
    name: fixa-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    open-in-view: false

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false